<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subscription Tracker</title>
    <link rel="stylesheet" href="./stylish/style.css">
  </head>
  <body>
    <main class="container py-4">
      <h1 class="mb-4">Subscription Tracker</h1>

      <section class="mb-3" aria-labelledby="service-heading">
        <h2 id="service-heading">Service</h2>
        <label class="form-label" for="service">Service name</label>
        <input class="form-control" id="service" name="service" type="text">
      </section>

      <section class="mb-3" aria-labelledby="provider-heading">
        <h2 id="provider-heading">Provider</h2>
        <label class="form-label" for="provider">Provider name</label>
        <input class="form-control" id="provider" name="provider" type="text">
      </section>

      <section class="mb-3" aria-labelledby="subscriber-heading">
        <h2 id="subscriber-heading">Subscriber</h2>
        <label class="form-label" for="subscriber">Subscriber name</label>
        <input class="form-control" id="subscriber" name="subscriber" type="text">
      </section>

      <section class="mb-3" aria-labelledby="renewal-date-heading">
        <h2 id="renewal-date-heading">Renewal date</h2>
        <label class="form-label" for="renewal-date">Date</label>
        <input class="form-control" id="renewal-date" name="renewal-date" type="date">
      </section>

      <section class="mb-4" aria-labelledby="category-heading">
        <h2 id="category-heading">Category</h2>
        <label class="form-label" for="category">Category name</label>
        <input class="form-control" id="category" name="category" type="text">
      </section>

      <section class="mb-4" aria-labelledby="subscriptions-heading">
        <h2 id="subscriptions-heading">Subscriptions</h2>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">Service</th>
                <th scope="col">Provider</th>
                <th scope="col">Subscriber</th>
                <th scope="col">Renewal date</th>
                <th scope="col">Category</th>
                <th scope="col">Status</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="7">No subscriptions yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">Summary</h2>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">Summary</th>
                <th scope="col">Count</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">Total subscriptions</th>
                <td><output id="total-subscriptions">0</output></td>
              </tr>
              <tr>
                <th scope="row">Expired subscriptions</th>
                <td><output id="expired-subscriptions">0</output></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
