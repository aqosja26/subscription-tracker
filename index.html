<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subscription Tracker</title>
    <link rel="stylesheet" href="./stylish/style.css">
    <script src="./javascripts/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Subscription Tracker</h1>

      <section aria-labelledby="service-heading">
        <h2 id="service-heading">Service</h2>
        <label for="service">Service name</label>
        <input id="service" name="service" type="text">
      </section>

      <section aria-labelledby="provider-heading">
        <h2 id="provider-heading">Provider</h2>
        <label for="provider">Provider name</label>
        <input id="provider" name="provider" type="text">
      </section>

      <section aria-labelledby="subscriber-heading">
        <h2 id="subscriber-heading">Subscriber</h2>
        <label for="subscriber">Subscriber name</label>
        <input id="subscriber" name="subscriber" type="text">
      </section>

      <section aria-labelledby="renewal-date-heading">
        <h2 id="renewal-date-heading">Renewal date</h2>
        <label for="renewal-date">Date</label>
        <input id="renewal-date" name="renewal-date" type="date">
      </section>

      <section aria-labelledby="category-heading">
        <h2 id="category-heading">Category</h2>
        <label for="category">Category name</label>
        <input id="category" name="category" type="text">
      </section>

      <section aria-labelledby="subscriptions-heading">
        <h2 id="subscriptions-heading">Subscriptions</h2>
        <table>
          <thead>
            <tr>
              <th scope="col">Service</th>
              <th scope="col">Provider</th>
              <th scope="col">Subscriber</th>
              <th scope="col">Renewal date</th>
              <th scope="col">Category</th>
              <th scope="col">Status</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="7">No subscriptions yet.</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">Summary</h2>
        <p>Total subscriptions: <output id="total-subscriptions">0</output></p>
        <p>Expired subscriptions: <output id="expired-subscriptions">0</output></p>
      </section>
    </main>
  </body>
</html>
