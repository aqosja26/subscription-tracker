<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subscription Tracker</title>
    <link rel="stylesheet" href="./stylish/style.css">
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IE0hB0Gzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
      defer></script>
    <script src="./javascripts/app.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand" href="./index.html">Subscription Tracker</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#main-navigation"
          aria-controls="main-navigation"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="./index.html#subscription-section" aria-current="page">Subscription</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./view.html">View</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="mb-4">Subscription Tracker</h1>

      <section id="subscription-section" aria-labelledby="subscription-heading">
        <h2 id="subscription-heading">Subscription form</h2>
        <form id="subscription-form">
          <div class="mb-3">
            <label class="form-label" for="service">Service</label>
            <input class="form-control" id="service" name="service" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="provider">Provider</label>
            <input class="form-control" id="provider" name="provider" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="subscriber">Subscriber</label>
            <input class="form-control" id="subscriber" name="subscriber" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="renewal-date">Renewal date</label>
            <input class="form-control" id="renewal-date" name="renewal-date" type="date" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="category">Category</label>
            <input class="form-control" id="category" name="category" type="text" required>
          </div>
          <button class="btn btn-primary" type="submit">Add subscription</button>
        </form>
      </section>
    </main>
  </body>
</html>
