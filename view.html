<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Subscriptions | Subscription Tracker</title>
    <link rel="stylesheet" href="./stylish/style.css">
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IE0hB0Gzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
      defer></script>
    <script src="./javascripts/app.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand" href="./index.html">Subscription Tracker</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#main-navigation"
          aria-controls="main-navigation"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="./index.html#subscription-section">Subscription</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./view.html" aria-current="page">View</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="mb-4">Subscriptions</h1>

      <section id="view-section" aria-labelledby="subscriptions-heading">
        <h2 id="subscriptions-heading">Subscriptions</h2>
        <div class="table-responsive mb-4">
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">Service</th>
                <th scope="col">Provider</th>
                <th scope="col">Subscriber</th>
                <th scope="col">Renewal date</th>
                <th scope="col">Category</th>
                <th scope="col">Status</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="7">No subscriptions yet.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <h2>Summary</h2>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">Summary</th>
                <th scope="col">Count</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">Total subscriptions</th>
                <td><output id="total-subscriptions">0</output></td>
              </tr>
              <tr>
                <th scope="row">Expired subscriptions</th>
                <td><output id="expired-subscriptions">0</output></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
